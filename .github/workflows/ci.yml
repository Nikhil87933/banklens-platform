name: BankLens CI

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: |
          pip install flake8

      - name: Check Project Structure
        run: |
          test -d 00_setup
          test -d 01_bronze
          test -d 02_silver
          test -d 03_gold
          test -d 04_data_quality
          test -d 05_workflows
          test -d 99_utils

      - name: Dangerous File Check
        run: |
          if find . -type f \( -name "*.csv" -o -name "*.env" -o -name "*.pem" -o -name "*.key" \) | grep .; then
            echo "Dangerous files detected"
            exit 1
          fi

      - name: Python Syntax Check
        run: |
          files=$(find . -name "*.py")
          if [ -n "$files" ]; then
            python -m py_compile $files
          fi

      - name: Flake8 Check
        run: |
          files=$(find . -name "*.py")
          if [ -n "$files" ]; then
            flake8 . \
              --max-line-length=120 \
              --ignore=E221,E501,E302,W292,E712,F401,F821,E305
          fi