bundle:
  name: banklens

targets:
  dev:
    default: true

resources:
  jobs:
    banklens_daily_pipeline:
      name: banklens_daily_pipeline

      tasks:
        - task_key: bronze_load
          spark_python_task:
            python_file: 01_bronze/02_run_bronze.py

        - task_key: silver_load
          depends_on:
            - task_key: bronze_load
          spark_python_task:
            python_file: 02_silver/02_run_silver.py

        - task_key: gold_load
          depends_on:
            - task_key: silver_load
          spark_python_task:
            python_file: 03_gold/02_run_gold.py